name: Damnlines API connection
on:
  push:
    paths:
      - 'tools/damnlines_check.py'
      - '.github/workflows/damnlines-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check API key and real morning coverage
        env:
          DAMNLINES_API_KEY: ${{ secrets.DAMNLINES_API_KEY }}
        run: python tools/damnlines_check.py

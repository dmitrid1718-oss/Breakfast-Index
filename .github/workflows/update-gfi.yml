name: Update GFI historical data
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate public Federal Reserve history
        run: python tools/update_gfi.py
      - name: Commit refreshed readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gfi-stress.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified GFI reference history"
            git push
          fi

name: Build our GFI history
on:
  push:
    paths:
      - 'tools/build_gfi.py'
      - '.github/workflows/update-gfi.yml'
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-gfi
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate GFI from public economic series
        run: python tools/build_gfi.py
      - name: Commit calculated readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gfi.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh calculated GFI observations"
            git push
          fi

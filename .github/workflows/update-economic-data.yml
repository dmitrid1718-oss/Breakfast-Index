name: Update Breakfast Index data
on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: breakfast-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate new official readings
        run: python tools/update_purchasing_power.py
      - name: Commit only changed readings
        run: |
          if git diff --quiet -- data/purchasing-power.json; then
            echo 'No updates'
            exit 0
          fi
          git config user.name "breakfast-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/purchasing-power.json
          git commit -m "data: refresh sourced monthly purchasing-power readings"
          git push
